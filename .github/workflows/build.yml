name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project PeopleMusic.xcodeproj \
            -scheme PeopleMusic \
            -configuration Release \
            -archivePath build/PeopleMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PeopleMusic.xcarchive/Products/Applications/PeopleMusic.app build/Payload/
          cd build && zip -r PeopleMusic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PeopleMusic-iOS
          path: build/PeopleMusic.ipa
